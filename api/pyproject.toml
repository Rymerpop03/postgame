[project]
name = "postgame-api"
version = "0.1.0"
description = "Postgame backend — see ../postgame/BACKEND-PLAN.md"
requires-python = ">=3.13,<3.14"

# Every entry here is justified in ../postgame/DEPENDENCIES.md. Nothing gets added to
# this list without an entry in that file in the same commit. Lower bounds only here;
# exact pinning of these and every transitive dependency lives in requirements.lock.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "psycopg[binary,pool]>=3.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "pillow>=11.0",
  "httpx>=0.27",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.6",
  "pip-audit>=2.7",
  "hypothesis>=6.112",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 96
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "S", "RET", "SIM", "PTH"]
# S101 (assert) is fine in tests; handled per-file below.
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
# S101 assert, S105/S106 hardcoded "passwords" (test fixtures), S603 subprocess with a
# fixed sys.executable + tool path — the CLI gates are tested by running them.
"tests/*" = ["S101", "S105", "S106", "S603"]
"tools/*" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_explicit = false
files = ["app", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
# -rs so a skipped database test is visible in the summary rather than a silent green tick.
# A schema test that passes because there was no database is worse than no test.
addopts = "-rs"
markers = [
  "db: requires a PostgreSQL test database (see tests/conftest.py)",
]
