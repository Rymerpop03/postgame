[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Timestamped, ordered filenames. The default is a bare hash, which sorts meaninglessly and
# makes "what shipped when" an archaeology exercise.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# No sqlalchemy.url here on purpose. It would be a database password in a committed file.
# migrations/env.py reads PG_MIGRATE_DATABASE_URL from the environment instead, and refuses to
# run without it.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
# A handler, deliberately. With this empty, `alembic upgrade` succeeded in total silence — which
# is exactly what made a migration that committed nothing easy to miss (see the Phase 2 outcome
# in BACKEND-PLAN.md). propagate=0 stops root re-printing every line.
handlers = console
propagate = 0
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
