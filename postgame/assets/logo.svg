<!-- Postgame — full lockup. The mark is a d-pad inside a speech bubble:
     the conversation that starts once the credits roll. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 64" width="310" height="64">
  <defs>
    <linearGradient id="g" x1="4" y1="3" x2="43" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8F7CFF"/>
      <stop offset="1" stop-color="#2EE0B4"/>
    </linearGradient>
    <linearGradient id="gw" x1="150" y1="20" x2="280" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8F7CFF"/>
      <stop offset="1" stop-color="#2EE0B4"/>
    </linearGradient>
  </defs>

  <g transform="translate(8 8)">
    <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#g)"/>
    <g fill="#0A0D14" opacity=".9">
      <rect x="10.5" y="10.5" width="27" height="21" rx="6"/>
      <path d="M16.5 30.5 L16 38.6 L24 30.5 Z"/>
    </g>
    <g fill="#F4F6FF">
      <rect x="21.7" y="13.5" width="4.6" height="4.6" rx="1.3"/>
      <rect x="26.9" y="18.7" width="4.6" height="4.6" rx="1.3"/>
      <rect x="21.7" y="23.9" width="4.6" height="4.6" rx="1.3"/>
      <rect x="16.5" y="18.7" width="4.6" height="4.6" rx="1.3"/>
    </g>
  </g>

  <text x="66" y="41" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif"
        font-size="30" font-weight="700" letter-spacing="-0.6" fill="#EAEEF7">Post<tspan fill="url(#gw)">game</tspan></text>
</svg>
